<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./script/register.js" defer></script>
    <link rel="stylesheet" href="./style/register.css">
</head>

<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card p-5 text-light bg-dark" style="min-width: 450px; ">
        <h2 class="text-center mb-4">Create your account</h2>
        <form id="re_form">
            <div class="mb-3">

                <input type="email" class="form-control" id="txt_cr_email" name="email" placeholder="Email" required>
            </div>
            <div class="mb-3">

                <input type="text" class="form-control" id="txt_cr_name" name="username" placeholder="Username" required>
            </div>
            <div class="mb-3">

                <input type="password" class="form-control" id="txt_cr_Pass" name="password" placeholder="Password" required>
            </div>
            <div class="mb-3">

                <input type="password" class="form-control" id="txt_cPass" name="password" placeholder="Confirm password" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label" for="remember">I agree with policy</label>
            </div>
            <button type="submit" class="btn btn-danger w-100">Sign up</button>
        </form>
        <p class="text-center mt-3">Already has an account? <a href="./login.html">Sign in</a></p>
    </div>


</body>

</html>
